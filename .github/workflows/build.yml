name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build APK
        env:
          # The signing key (app/release.jks) is committed on purpose so every build can be
          # installed as an update over the previous one. This repo is public, so treat any
          # Car Service APK not downloaded from this repo's Releases as untrusted.
          SIGNING_PASSWORD: "8hH-0FmhESb44ov86v0m_KKv"
        run: ./gradlew assembleRelease --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/release/*.apk CarService.apk
      - uses: actions/upload-artifact@v4
        with:
          name: car-service-apk
          path: CarService.apk
      # Every build on main becomes a release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/CarService.apk
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Car Service ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **CarService.apk** below and open it on your phone to install.
            Changes: ${{ github.event.head_commit.message }}
          files: CarService.apk
